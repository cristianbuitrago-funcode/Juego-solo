# Compila la versión firmada para Google Play:
#   - ecos-play-aab: Android App Bundle (.aab), lo que se sube a Google Play.
#   - ecos-release-apk: APK firmado (para instalar o distribuir fuera de Play).
#
# Se lanza a mano (Actions → «Publicación Android» → Run workflow) o al subir
# una etiqueta v1.2.3. La clave de subida se lee de los secretos del
# repositorio (Settings → Secrets and variables → Actions):
#   ECOS_KEYSTORE_BASE64   el archivo .jks codificado en base64
#   ECOS_KEYSTORE_PASSWORD contraseña del almacén
#   ECOS_KEY_ALIAS         alias de la clave
#   ECOS_KEY_PASSWORD      contraseña de la clave
name: Publicación Android

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Versión visible (por ejemplo 1.0.0)'
        required: true
        default: '1.0.0'
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ECOS_VERSION_CODE: ${{ github.run_number }}
      ECOS_VERSION_NAME: ${{ github.event.inputs.version_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - name: Comprobar los secretos de firma
        env:
          KS: ${{ secrets.ECOS_KEYSTORE_BASE64 }}
          PW: ${{ secrets.ECOS_KEYSTORE_PASSWORD }}
          AL: ${{ secrets.ECOS_KEY_ALIAS }}
          KP: ${{ secrets.ECOS_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KS" ] && missing="$missing ECOS_KEYSTORE_BASE64"
          [ -z "$PW" ] && missing="$missing ECOS_KEYSTORE_PASSWORD"
          [ -z "$AL" ] && missing="$missing ECOS_KEY_ALIAS"
          [ -z "$KP" ] && missing="$missing ECOS_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Faltan secretos de firma:$missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas y compilación web
        run: |
          npm test
          npm run build

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Plataforma Android 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Copiar la web al proyecto Android
        run: npx cap sync android

      - name: Restaurar la clave de subida
        env:
          KS: ${{ secrets.ECOS_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Compilar AAB y APK firmados
        working-directory: android
        env:
          ECOS_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ECOS_KEYSTORE_PASSWORD: ${{ secrets.ECOS_KEYSTORE_PASSWORD }}
          ECOS_KEY_ALIAS: ${{ secrets.ECOS_KEY_ALIAS }}
          ECOS_KEY_PASSWORD: ${{ secrets.ECOS_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Verificar la firma
        run: |
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab | tail -1
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | head -3

      - name: Borrar la clave del runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: ecos-play-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ecos-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
